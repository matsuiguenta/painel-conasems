services:
  painel:
    build: .
    image: painel-conasems:latest
    container_name: painel-conasems
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: America/Sao_Paulo
      PAINEL_INTERVALO_MINUTOS: "20"
      # Município inicial, usado somente quando ainda não existe config.json
      # no volume. Depois disso, vale o que estiver no painel /config.
      PAINEL_IBGE: "4102406"
      PAINEL_MUNICIPIO: "Bandeirantes"
      PAINEL_UF: "PR"
    volumes:
      - painel-dados:/app/dados
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/status', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3

volumes:
  painel-dados:
